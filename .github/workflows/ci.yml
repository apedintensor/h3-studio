name: Test and release Sixnine platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Prepare and publish a tested artifact (does not deploy it)
        type: boolean
        default: false
      release_kind:
        description: Artifact to prepare; frontend does not rebuild the API or controller
        type: choice
        options: [platform, frontend]
        default: platform
      approved_commit:
        description: Deploy an exact platform commit independently approved on the host
        type: string
        default: ''
      approved_frontend_commit:
        description: Deploy an exact frontend commit independently approved and API-compatible on the host
        type: string
        default: ''
      resume_command:
        description: Resume an existing SSM command without resubmission (one approved deployment only)
        type: string
        default: ''

permissions:
  contents: read

# Never filter the workflow itself by changed paths: the stable `test` check
# must report a result for every push/PR, including an explicitly allowed doc edit.
# Publishing and deployment are manual and never share cancellation with checks.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scope.outputs.python }}
      postgres: ${{ steps.scope.outputs.postgres }}
      frontend: ${{ steps.scope.outputs.frontend }}
      containers: ${{ steps.scope.outputs.containers }}
      legacy: ${{ steps.scope.outputs.legacy }}
      frontend_tools: ${{ steps.scope.outputs.frontend_tools }}
      category: ${{ steps.scope.outputs.category }}
      action: ${{ steps.scope.outputs.action }}
      tested_sha: ${{ steps.scope.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check classification safety without dependencies or network
        run: python -m unittest test_ci_changes -v
      - name: Select checks from the complete local diff and validate dispatch inputs
        id: scope
        run: python tools/ci_changes.py

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media test tools from signed Ubuntu repositories
        timeout-minutes: 5
        run: |
          sudo sed -i -E 's#http://(azure.archive.ubuntu.com|archive.ubuntu.com|security.ubuntu.com)/ubuntu#https://\1/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y ffmpeg fontconfig fonts-noto-cjk
      - run: python -m pip install -r requirements.lock.txt
      - name: Complete offline suite (temporary data, no model inference)
        run: python -m unittest discover -s . -p 'test_*.py' -v

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sixnine_test
          POSTGRES_USER: sixnine_test
          # Synthetic isolated CI database only; never use this in deployment.
          POSTGRES_PASSWORD: sixnine-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixnine_test -d sixnine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media test tools from signed Ubuntu repositories
        timeout-minutes: 5
        run: |
          sudo sed -i -E 's#http://(azure.archive.ubuntu.com|archive.ubuntu.com|security.ubuntu.com)/ubuntu#https://\1/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y ffmpeg fontconfig fonts-noto-cjk
      - run: python -m pip install -r requirements.lock.txt
      - name: PostgreSQL concurrency and API contracts (isolated CI service)
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://sixnine_test:sixnine-ci-test-only@127.0.0.1:5432/sixnine_test
        run: python -m unittest test_platform_repository test_platform_queue test_platform_autoscale test_platform_control test_platform_worker test_platform_drain_safe_runner test_platform_production_scaler test_platform_on_demand_scaler test_platform_backlog_handoff test_platform_preparation_recovery test_platform_preparation_idle test_platform_production_boot_memory test_platform_fleet test_platform_scaler test_platform_api test_platform_execution_policy test_platform_batches test_platform_storage_multipart test_platform_artifact_writer test_platform_diagnostics test_platform_capacity test_platform_capacity_api test_platform_guided test_platform_generation_draft test_platform_project_activity test_platform_capacity_cli test_platform_reliability test_platform_request_admission test_platform_admission_review test_platform_generated_audio test_platform_caption_plans test_platform_render_plans test_platform_render_backend test_platform_lium_provider test_platform_boyesir_backend test_platform_backup_postgres test_platform_upload_route test_platform_asset_recovery -v

      - name: Queued user task startup and recovery contracts
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://sixnine_test:sixnine-ci-test-only@127.0.0.1:5432/sixnine_test
        run: python -m unittest test_platform_queued_task_policy test_platform_queued_boot test_platform_queued_task_runner test_platform_queued_task_hold test_platform_long_duration_policy test_platform_duration_quote test_platform_runtime_adoption test_platform_live_runtime_handoff -v

      - name: Engine-bound routing and WanGP API integration (synthetic CPU media only)
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://sixnine_test:sixnine-ci-test-only@127.0.0.1:5432/sixnine_test
        run: python -m unittest test_platform_engine_routing test_platform_wangp_api test_platform_engine_cold_capacity test_platform_wangp_service_hold -v

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yingxu/package-lock.json
      - name: Verify source-only Yingxu release snapshot
        run: python tools/sync_yingxu_source.py --verify-snapshot
      - run: npm ci --ignore-scripts
        working-directory: yingxu
      - name: Frontend behavior tests
        run: npm test
        working-directory: yingxu
      - name: Compile exact tested frontend at the site root
        run: npm run build -- --base / --outDir ../yingxu-dist
        working-directory: yingxu
      - name: Package frontend candidate (publication waits for every required gate)
        if: needs.changes.outputs.action == 'prepare-frontend'
        run: |
          python tools/build_frontend_release.py "$GITHUB_SHA" yingxu-dist frontend-release
          python tools/check_frontend_bundle.py "$GITHUB_SHA" frontend-release
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.action == 'prepare-frontend'
        with:
          name: sixnine-frontend-${{ github.sha }}
          path: frontend-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  frontend-tools:
    needs: changes
    if: needs.changes.outputs.frontend_tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Frontend packaging, compatibility and host boundary tests only
        run: python -m unittest test_yingxu_snapshot test_frontend_release test_frontend_deploy test_release_contract test_platform_frontend -v

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.legacy == 'true'
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - name: Verify source-only Yingxu release snapshot
        run: python tools/sync_yingxu_source.py --verify-snapshot
      - name: Check legacy browser and deployment config without secrets
        if: needs.changes.outputs.legacy == 'true'
        env:
          H3_IMAGE: h3-studio:test
          H3_RELEASE: test
          H3_DOMAIN: studio.example.test
        run: |
          node --check web/app.js
          bash -n deploy/release.sh
          docker compose -f deploy/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build cached legacy CPU runtime
        if: needs.changes.outputs.legacy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          provenance: false
          tags: h3-studio:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sixnine-legacy-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'type=gha,mode=max,scope=sixnine-legacy-linux-amd64' || '' }}
      - name: Test the exact legacy image with synthetic accounts
        if: needs.changes.outputs.legacy == 'true'
        run: python tools/check_container.py "h3-studio:$GITHUB_SHA"
      - name: Build cached unified platform runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.platform
          load: true
          platforms: linux/amd64
          provenance: false
          tags: sixnine-platform:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sixnine-platform-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'type=gha,mode=max,scope=sixnine-platform-linux-amd64' || '' }}
      - name: Test exact unprivileged Linux image without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 1g --cpus 2 --tmpfs /data:size=268435456,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:size=134217728,mode=1777 \
            --mount "type=bind,source=$PWD/tools/check_platform_container.py,target=/check_platform_container.py,readonly" \
            "sixnine-platform:$GITHUB_SHA" python /check_platform_container.py
      - name: Package platform candidate (publication waits for every required gate)
        if: needs.changes.outputs.action == 'prepare-platform'
        run: |
          python tools/build_platform_release.py "$GITHUB_SHA" platform-release
          python tools/check_platform_bundle.py "$GITHUB_SHA" platform-release
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.action == 'prepare-platform'
        with:
          name: sixnine-platform-${{ github.sha }}
          path: platform-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test:
    # Preserve the existing required-check identity. Only explicitly unselected
    # gates may be skipped; failures, cancellations and accidental skips fail it.
    if: always()
    needs: [changes, python, postgres, frontend, frontend-tools, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require every selected gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('CI classification or dispatch validation failed')
          flags = results['changes']['outputs']
          for job, flag in [('python', 'python'), ('postgres', 'postgres'), ('frontend', 'frontend'),
                            ('frontend-tools', 'frontend_tools'), ('containers', 'containers')]:
              selected = flags.get(flag)
              if selected not in ('true', 'false'):
                  raise SystemExit('CI selection output missing: ' + flag)
              expected = 'success' if selected == 'true' else 'skipped'
              if results[job]['result'] != expected:
                  raise SystemExit('Required CI result mismatch: ' + job)
          print('Every selected check passed; no publication or deployment authorized by this check')
          PY

  publish-aws:
    # Publication cannot approve/execute a host release, read passwords or rent
    # compute. Push/PR events never assume a publication identity.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.changes.outputs.action == 'prepare-platform' && vars.SIXNINE_AWS_PUBLISH_ROLE != '' }}
    needs: [changes, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sixnine-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/download-artifact@v4
        with:
          name: sixnine-platform-${{ github.sha }}
          path: platform-release
      - name: Assume release-only identity with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.SIXNINE_AWS_PUBLISH_ROLE }}
          aws-region: ap-southeast-1
          allowed-account-ids: '829135631045'
      - run: python -m pip install -r requirements.lock.txt
      - name: Publish validated platform bundle (host approval remains independent)
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python tools/publish_aws_release.py "$RELEASE_COMMIT" platform-release

  publish-frontend-aws:
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.changes.outputs.action == 'prepare-frontend' && vars.SIXNINE_AWS_PUBLISH_ROLE != '' }}
    needs: [changes, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sixnine-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/download-artifact@v4
        with:
          name: sixnine-frontend-${{ github.sha }}
          path: frontend-release
      - name: Assume release-only identity with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.SIXNINE_AWS_PUBLISH_ROLE }}
          aws-region: ap-southeast-1
          allowed-account-ids: '829135631045'
      - run: python -m pip install -r requirements.lock.txt
      - name: Publish validated frontend bundle (host approval and API match still required)
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python tools/publish_frontend_release.py "$RELEASE_COMMIT" frontend-release

  deploy-approved-aws:
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.changes.outputs.action == 'deploy-platform' && vars.SIXNINE_AWS_DEPLOY_ROLE != '' }}
    needs: [changes, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sixnine-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Assume fixed-document deployment identity
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.SIXNINE_AWS_DEPLOY_ROLE }}
          aws-region: ap-southeast-1
          allowed-account-ids: '829135631045'
      - run: python -m pip install -r requirements.lock.txt
      - name: Deploy previously tested and independently approved platform release
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          RESUME_COMMAND: ${{ inputs.resume_command }}
        shell: bash
        run: |
          args=("$APPROVED_COMMIT")
          if [[ -n "$RESUME_COMMAND" ]]; then
            args+=(--resume-command "$RESUME_COMMAND")
          fi
          python tools/deploy_aws_release.py "${args[@]}"

  deploy-approved-frontend-aws:
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.changes.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.changes.outputs.action == 'deploy-frontend' && vars.SIXNINE_AWS_DEPLOY_ROLE != '' }}
    needs: [changes, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Same host lock as complete platform deployment; never race the two.
      group: sixnine-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Assume fixed-document deployment identity
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.SIXNINE_AWS_DEPLOY_ROLE }}
          aws-region: ap-southeast-1
          allowed-account-ids: '829135631045'
      - run: python -m pip install -r requirements.lock.txt
      - name: Deploy approved frontend with matching deployed API compatibility
        env:
          APPROVED_COMMIT: ${{ inputs.approved_frontend_commit }}
          RESUME_COMMAND: ${{ inputs.resume_command }}
        shell: bash
        run: |
          args=("$APPROVED_COMMIT" --frontend)
          if [[ -n "$RESUME_COMMAND" ]]; then
            args+=(--resume-command "$RESUME_COMMAND")
          fi
          python tools/deploy_aws_release.py "${args[@]}"
