name: Test and release Sixnine platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this tested main commit to Lightsail (CPU only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sixnine_test
          POSTGRES_USER: sixnine_test
          # Synthetic isolated CI database only; never use this in deployment.
          POSTGRES_PASSWORD: sixnine-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixnine_test -d sixnine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - run: python -m pip install -r requirements.lock.txt
      - name: Offline tests (temporary data, no model inference)
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: PostgreSQL concurrency and complete API contract (local CI service)
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://sixnine_test:sixnine-ci-test-only@127.0.0.1:5432/sixnine_test
        run: python -m unittest test_platform_repository test_platform_queue test_platform_autoscale test_platform_control test_platform_worker test_platform_fleet test_platform_scaler test_platform_api test_platform_execution_policy test_platform_batches test_platform_artifact_writer test_platform_diagnostics test_platform_capacity test_platform_capacity_api test_platform_capacity_cli test_platform_reliability test_platform_request_admission test_platform_admission_review test_platform_generated_audio test_platform_caption_plans test_platform_render_plans test_platform_lium_provider test_platform_boyesir_backend test_platform_backup_postgres -v
      - name: Verify source-only Yingxu release snapshot
        run: python tools/sync_yingxu_source.py --verify-snapshot
      - run: node --check web/app.js
      - run: bash -n deploy/release.sh
      - name: Check deployment config without secrets
        env:
          H3_IMAGE: h3-studio:test
          H3_RELEASE: test
          H3_DOMAIN: studio.example.test
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build CPU runtime and test it with synthetic accounts
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t "h3-studio:$GITHUB_SHA" .
          python tools/check_container.py "h3-studio:$GITHUB_SHA"
      - name: Build unified platform and test unprivileged Linux runtime without network
        run: |
          docker build -f Dockerfile.platform --label org.opencontainers.image.revision="$GITHUB_SHA" -t "sixnine-platform:$GITHUB_SHA" .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 1g --cpus 2 --tmpfs /data:size=268435456,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:size=134217728,mode=1777 \
            --mount "type=bind,source=$PWD/tools/check_platform_container.py,target=/check_platform_container.py,readonly" \
            "sixnine-platform:$GITHUB_SHA" python /check_platform_container.py
      - name: Package the tested platform image and exact deployment manifest
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        run: |
          python tools/build_platform_release.py "$GITHUB_SHA" platform-release
          python tools/check_platform_bundle.py "$GITHUB_SHA" platform-release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        with:
          name: sixnine-platform-${{ github.sha }}
          path: platform-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    # A fixed egress runner/private route must be provisioned separately. The
    # default hosted runner's changing IP cannot reach the host's admin /32.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' && vars.SIXNINE_DEPLOY_RUNNER != ''
    needs: test
    runs-on: ${{ vars.SIXNINE_DEPLOY_RUNNER }}
    timeout-minutes: 30
    environment: production
    concurrency:
      group: sixnine-platform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sixnine-platform-${{ github.sha }}
          path: platform-release
      - name: Send tested CPU bundle to the installed host controller
        env:
          DEPLOY_HOST: ${{ vars.LIGHTSAIL_HOST }}
          DEPLOY_USER: ${{ vars.LIGHTSAIL_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] && [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          identity_dir="$(mktemp -d "$RUNNER_TEMP/sixnine-deploy.XXXXXXXX")"
          printf 'DEPLOY_IDENTITY_DIR=%s\n' "$identity_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$identity_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$identity_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          target="/srv/sixnine/incoming/$RELEASE_COMMIT"
          opts=(-i "$identity_dir/key" -o "UserKnownHostsFile=$identity_dir/known_hosts" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${opts[@]}" "$remote" "mkdir -p '$target'"
          scp "${opts[@]}" platform-release/image.tar.gz platform-release/release-manifest.json \
            platform-release/compose.yaml platform-release/Caddyfile platform-release/init_database.py \
            platform-release/check_config.py "$remote:$target/"
          # Controller and its validator are installed separately as root-owned
          # code. Never sudo a script from the deploy user's incoming directory.
          ssh "${opts[@]}" "$remote" "sudo -n /opt/sixnine-release/release.py '$RELEASE_COMMIT'"
      - name: Remove temporary deployment identity from the runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${DEPLOY_IDENTITY_DIR:-}" && "$DEPLOY_IDENTITY_DIR" == "$RUNNER_TEMP"/sixnine-deploy.* ]]; then
            rm -f -- "$DEPLOY_IDENTITY_DIR/key" "$DEPLOY_IDENTITY_DIR/known_hosts"
            rmdir -- "$DEPLOY_IDENTITY_DIR"
          fi
