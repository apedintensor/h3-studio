name: h3-studio

services:
  app:
    image: ${H3_IMAGE:?Set H3_IMAGE to the locally built h3-studio commit image}
    pull_policy: never
    network_mode: host
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      H3_STUDIO_DATA: /data
      H3_CLOUD_STATE: /run/h3-studio/cloud-state.json
      H3_GENERATION_ENABLED: "0"
      H3_AUTH_MODE: password
      H3_PUBLIC_ORIGIN: https://${H3_DOMAIN:?Set H3_DOMAIN to the dedicated DNS hostname}
      H3_RELEASE: ${H3_RELEASE:?Set H3_RELEASE to the source commit SHA}
    volumes:
      # Host directories must already exist. UID/GID 10001 must own data.
      - type: bind
        source: /srv/h3-studio/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/h3-studio/runtime
        target: /run/h3-studio
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=268435456,mode=1777
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8844/healthz', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      H3_DOMAIN: ${H3_DOMAIN:?Set H3_DOMAIN to the dedicated DNS hostname}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16777216,mode=1777
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Certificate state survives application releases. Do not use down --volumes.
  caddy_data:
  caddy_config:
